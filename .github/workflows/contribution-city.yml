name: Update Contribution City
on:
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * *'
  push:
    branches: [main, profile/neon-metropolis]
    paths:
      - 'scripts/**'
      - '.github/workflows/contribution-city.yml'
permissions:
  contents: read
concurrency:
  group: profile-assets-${{ github.ref }}
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Fetch actual calendar and public repository statistics
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python scripts/generate_city.py
          python scripts/generate_stats.py
      - name: Validate before publication
        run: |
          python -m unittest discover -s tests
          python scripts/validate_profile.py
      - name: Commit only generated data and activity assets when changed
        run: |
          git add assets/contribution-city.svg assets/activity-dashboard.svg data/contributions.json data/repositories.json
          if ! git diff --staged --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "chore: refresh verified profile activity"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
