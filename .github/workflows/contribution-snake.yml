name: Update Contribution Snake
on:
  workflow_dispatch:
  schedule:
    - cron: '47 3 * * 1'
  push:
    branches: [main, profile/neon-metropolis]
    paths:
      - '.github/workflows/contribution-snake.yml'
      - 'scripts/attach_snake.py'
permissions:
  contents: read
concurrency:
  group: profile-assets-${{ github.ref }}
  cancel-in-progress: false
jobs:
  snake:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: Platane/snk/svg-only@d8f6715049803e982ee5ff501b6b9b7d5deeb09b # v3
        with:
          github_user_name: AishwaryaChandel27
          outputs: |
            assets/contribution-snake.svg?color_snake=%2322D3EE&color_dots=%2310182B,%23254b68,%23583d9b,%23A855F7,%23F472B6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Add the snake only after a successful generation
        run: |
          python scripts/attach_snake.py
          python scripts/validate_profile.py
      - name: Publish only the snake and its README marker
        run: |
          git add assets/contribution-snake.svg README.md
          if ! git diff --staged --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "chore: refresh contribution snake"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
