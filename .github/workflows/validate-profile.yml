name: Validate Profile
on:
  pull_request:
  push:
    branches: [main, profile/neon-metropolis]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -v
      - run: python scripts/validate_profile.py
      - name: Rebuild static assets and confirm deterministic output
        run: |
          python scripts/generate_assets.py
          python scripts/generate_city.py --input data/contributions.json
          python scripts/generate_stats.py --input data/repositories.json
          git diff --exit-code -- assets data
